services:
  phprun:
    image: ghcr.io/f1161291/phprun:latest
#    image: f1161291/phprun
    container_name: phprun
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8100:8100"
      - "8600-8699:8600-8699"
    environment:
      TZ: Asia/Shanghai
      PANEL_TOKEN: ""
      PANEL_PORT: "8100"
      PORT_RANGE_START: "8600"
      PORT_RANGE_END: "8699"
      DEFAULT_HOST: "0.0.0.0"
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      COMPOSER_MIRROR: ${COMPOSER_MIRROR:-https://mirrors.aliyun.com/composer/}
      AUTO_INSTALL_DEPS: ${AUTO_INSTALL_DEPS:-1}
      LOG_KEEP_DAYS: ${LOG_KEEP_DAYS:-5}
      TG_BOT_TOKEN: ""
      TG_CHAT_ID: ""
    volumes:
      - ./scripts:/mount      
      - ./data:/data         
      - /var/run/docker.sock:/var/run/docker.sock
