services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    ports:
      - "8000:80"                     # 临时访问：http://你的IP:8000
    volumes:
      - ./data:/data
    environment:
      - DOMAIN=https://mm.xiray.cf
      - SIGNUPS_ALLOWED=true
