services:
  lx-sync-server:
    image: xcq0607/lxserver:latest
    container_name: lxmusic
    restart: always
    ports:
      - "163:9527"
    volumes:
      - ./data:/server/data
      - ./logs:/server/logs
      - ./cache:/server/cache
      - ./music:/server/music
    environment:
      - NODE_ENV=production
      - SUBSONIC_ENABLE=true
      - SUBSONIC_ONLINE_SEARCH=true
      - SUBSONIC_ONLINE_SEARCH_MODE=fallback
      - SUBSONIC_ONLINE_SEARCH_SOURCES=wy,tx,kw,kg,mg
      - SUBSONIC_CACHE_ON_PLAY=true
      - SUBSONIC_PLAY_CACHE_FIRST=true
      - ENABLE_CACHE_SIZE_LIMIT=true
      - CACHE_SIZE_LIMIT=1024
